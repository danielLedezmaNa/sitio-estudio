<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    width:1200px; height:630px; overflow:hidden;
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;
    background:#13100E; color:#F2EBE1;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:72px 80px; position:relative;
  }
  /* amanecer sobre la sierra, igual que el hero del sitio */
  body::before{
    content:''; position:absolute; top:-300px; left:50%; transform:translateX(-50%);
    width:1300px; height:900px;
    background:
      radial-gradient(ellipse at 50% 46%, rgba(217,113,63,0.26) 0%, transparent 62%),
      radial-gradient(ellipse at 50% 62%, rgba(118,96,120,0.18) 0%, transparent 70%);
  }
  /* silueta de sierra al pie */
  .sierra{position:absolute; left:0; bottom:0; width:1200px; height:190px;}
  .sierra .far{fill:#2A211A;}
  .sierra .near{fill:#13100E;}
  .top{display:flex; align-items:center; gap:20px; position:relative;}
  .mark{width:76px; height:76px; flex:0 0 76px;}
  .name{font-family:'Fraunces',Georgia,serif; font-size:2.1rem; font-weight:700; letter-spacing:-0.015em;}
  h1{
    position:relative; font-family:'Fraunces',Georgia,serif;
    font-size:4.6rem; line-height:1.06;
    font-weight:800; letter-spacing:-0.02em; max-width:15ch;
  }
  h1 .hl{color:#E8C07D;}
  .bottom{display:flex; justify-content:space-between; align-items:flex-end; position:relative;}
  .tag{font-size:1.5rem; color:#A79B8C; font-weight:500;}
  .url{
    font-size:1.35rem; font-weight:700; color:#1B0E06;
    background:#D9713F; padding:14px 28px; border-radius:999px;
  }
</style>
</head>
<body>

  <svg class="sierra" viewBox="0 0 1200 190" preserveAspectRatio="none">
    <path class="far" d="M0 118 L100 86 L196 110 L300 64 L392 98 L500 56 L600 94 L700 60 L816 102 L920 70 L1020 106 L1108 78 L1200 108 V190 H0 Z"/>
    <path class="near" d="M0 160 L117 136 L225 158 L333 124 L433 152 L550 118 L667 148 L775 126 L883 156 L992 130 L1100 158 L1200 140 V190 H0 Z"/>
  </svg>

  <div class="top">
    <svg class="mark" viewBox="0 0 100 100">
      <rect width="100" height="100" rx="24" fill="#201B17"/>
      <path d="M50 47V84" stroke="#8A7458" stroke-width="7" stroke-linecap="round" fill="none"/>
      <g stroke="#D9713F" stroke-width="7" stroke-linecap="round" fill="none">
        <path d="M50 47Q50 30 50 14"/><path d="M50 47Q38 30 32 18"/><path d="M50 47Q62 30 68 18"/>
        <path d="M50 47Q30 36 17 32"/><path d="M50 47Q70 36 83 32"/>
        <path d="M50 47Q28 48 16 52"/><path d="M50 47Q72 48 84 52"/>
      </g>
    </svg>
    <span class="name">Estudio Altiplano</span>
  </div>

  <h1>Sitios web que traen <span class="hl">clientes reales</span></h1>

  <div class="bottom">
    <span class="tag">Negocios locales · San Luis Potosí</span>
    <span class="url">estudioaltiplano.mx</span>
  </div>

</body>
</html>
