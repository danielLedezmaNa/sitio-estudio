<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:#13100E; color:#F2EBE1;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:24px; line-height:1.6;
  }
  .code{
    font-family:'Fraunces', Georgia, serif;
    font-size:clamp(4rem,16vw,8rem); font-weight:700; color:#D9713F;
    line-height:1; letter-spacing:-0.03em;
    /* opsz fijo: evita los trazos filiformes de Fraunces en tama\u00f1os grandes */
    font-optical-sizing:none; font-variation-settings:"opsz" 24;
  }
  h1{
    font-family:'Fraunces', Georgia, serif;
    font-size:clamp(1.35rem,4vw,2rem); margin:18px 0 12px; font-weight:700; letter-spacing:-0.015em;
  }
  p{color:#A79B8C; max-width:420px; margin:0 auto 30px;}
  a{
    display:inline-block; padding:13px 28px; border-radius:100px;
    background:#D9713F; color:#1B0E06; font-weight:700; text-decoration:none;
    transition:transform .15s;
  }
  a:hover{transform:translateY(-2px);}
  .alt{margin-top:22px; font-size:.86rem; color:#A79B8C;}
</style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Esta página no existe</h1>
